<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:linear-gradient(160deg,#0b2b3b,#1b4f6e); }

#seal {
  position:absolute;
  width:180px; height:180px;
  left:30px; top:30px;
  transition: filter .15s;
}

.body {
  position:absolute; width:130px; height:95px;
  left:25px; bottom:10px;
  background: radial-gradient(circle at 35% 30%, #c2e0f0, #4d7389);
  border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
  border:3px solid #ecf9ff;
  box-shadow:0 8px 0 #2c4654, 0 12px 12px rgba(0,0,0,.3);
}
.belly {
  position:absolute; width:70px; height:48px;
  left:55px; bottom:10px;
  background:#e5f2fa; border-radius:50%;
  box-shadow: inset 0 -4px 6px #aac2d0;
}
.head {
  position:absolute; width:95px; height:80px;
  left:42px; top:0;
  background: radial-gradient(circle at 40% 30%, #c2e0f0, #4d7389);
  border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
  border:3px solid #ecf9ff;
  box-shadow:0 6px 0 #2c4654, 0 10px 10px rgba(0,0,0,.25);
}
.eye {
  position:absolute; width:18px; height:22px;
  background:#1e1e1e; border-radius:50%;
  top:26px;
  box-shadow:0 0 0 3px #fff, 0 0 0 5px #1e1e1e33;
}
.eye.l { left:20px; }
.eye.r { right:20px; }
.eye::after {
  content:''; position:absolute;
  width:6px; height:8px; background:#fff;
  border-radius:50%; top:4px; left:5px;
}
.nose {
  position:absolute; width:22px; height:15px;
  background:#2a2a2a; border-radius:50% 50% 40% 40%;
  left:36px; top:52px;
}
.whisker {
  position:absolute; width:28px; height:2px;
  background:#e7f0f5; border-radius:2px;
  top:56px; opacity:.9;
}
.whisker.l { left:-6px; transform:rotate(-6deg); }
.whisker.r { right:-6px; transform:rotate(6deg); }
.whisker.l2 { left:-8px; top:64px; transform:rotate(4deg); }
.whisker.r2 { right:-8px; top:64px; transform:rotate(-4deg); }

.bomb {
  position:absolute; width:55px; height:62px;
  left:80px; bottom:-5px;
  background: radial-gradient(circle at 30% 30%, #666, #1a1a1a);
  border-radius:40% 40% 30% 30%;
  border:2px solid #878787;
  box-shadow:0 6px 0 #0a0a0a, 0 10px 10px rgba(0,0,0,.4);
  z-index:-1;
}
.spark {
  position:absolute; width:14px; height:14px;
  left:105px; bottom:58px;
  background:#ffb347; border-radius:50%;
  box-shadow:0 0 12px 4px #ffaa33, 0 0 25px 8px #ff8800;
  animation:sp .4s infinite alternate;
}
@keyframes sp {
  from { transform:scale(.8); opacity:.7; }
  to   { transform:scale(1.3); opacity:1; }
}

#seal.boom { filter: brightness(2.5) sepia(1) hue-rotate(10deg) saturate(6); }
#seal.boom .spark { opacity:0; }

#boomText {
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%) rotate(-12deg);
  font-size:48px; font-weight:900;
  color:#ffcc00; font-family:Impact,sans-serif;
  text-shadow:0 0 12px #ff5500, 0 0 24px #ff2200, 3px 3px 0 #7a2e00;
  opacity:0; pointer-events:none; white-space:nowrap;
  transition:opacity .1s;
}
</style>
</head>
<body>

<div id="seal">
  <div class="bomb"></div>
  <div class="spark"></div>
  <div class="body"></div>
  <div class="belly"></div>
  <div class="head">
    <div class="eye l"></div>
    <div class="eye r"></div>
    <div class="nose"></div>
    <div class="whisker l"></div>
    <div class="whisker r"></div>
    <div class="whisker l2"></div>
    <div class="whisker r2"></div>
  </div>
</div>
<div id="boomText">BOOM!</div>

<script>
var seal = document.getElementById('seal');
var text = document.getElementById('boomText');
var x = 20, y = 20, vx = 2, vy = 1.5;
var exploded = false;

function move() {
  var W = window.innerWidth, H = window.innerHeight;
  var w = seal.offsetWidth, h = seal.offsetHeight;

  if (!exploded) {
    x += vx; y += vy;
    if (x <= 0) { x = 0; vx = Math.abs(vx); }
    if (y <= 0) { y = 0; vy = Math.abs(vy); }
    if (x >= W - w) { x = W - w; vx = -Math.abs(vx); }
    if (y >= H - h) { y = H - h; vy = -Math.abs(vy); }
    seal.style.left = x + 'px';
    seal.style.top  = y + 'px';
  }
  requestAnimationFrame(move);
}

seal.addEventListener('click', function() {
  if (exploded) return;
  exploded = true;
  seal.classList.add('boom');
  text.style.opacity = '1';
  if (navigator.vibrate) navigator.vibrate(200);

  setTimeout(function() {
    exploded = false;
    seal.classList.remove('boom');
    text.style.opacity = '0';
    vx = (Math.random() > 0.5 ? 1 : -1) * (1.5 + Math.random());
    vy = (Math.random() > 0.5 ? 1 : -1) * (1.5 + Math.random());
  }, 1500);
});

move();
</script>
</body>
</html>
